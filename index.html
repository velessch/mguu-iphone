  <script>
    (function(){
      'use strict';
      var BUILD='039';
      var CURRENT_CACHE='mguu-web-v039-vercel';
      var failed=false;

      function showBootError(){
        if(failed)return;failed=true;
        var boot=document.getElementById('boot');
        if(!boot)return;
        var note=document.createElement('div');
        note.style.cssText='margin-top:18px;max-width:320px;text-align:center;font-size:13px;line-height:1.45;color:#8b95a7';
        note.textContent='Не удалось загрузить актуальную версию. Проверьте интернет и откройте приложение ещё раз.';
        boot.firstElementChild.appendChild(note);
      }

      async function purgeLegacyCaches(){
        if(!('caches' in window))return;
        var keys=await caches.keys();
        await Promise.all(keys.filter(function(key){
          return key.indexOf('mguu-web-')===0 && key!==CURRENT_CACHE;
        }).map(function(key){return caches.delete(key);}));
      }

      function loadCurrentApp(){
        return new Promise(function(resolve,reject){
          var old=document.getElementById('mguu-current-app');
          if(old)old.remove();
          var script=document.createElement('script');
          script.id='mguu-current-app';
          script.src='./app.js?v='+BUILD;
          script.async=false;
          script.onload=resolve;
          script.onerror=reject;
          document.body.appendChild(script);
        });
      }

      async function installCurrentWorker(){
        if(!('serviceWorker' in navigator))return null;
        var reg=await navigator.serviceWorker.register('./sw.js?v='+BUILD,{updateViaCache:'none'});
        try{await reg.update();}catch(e){}
        if(reg.waiting){try{reg.waiting.postMessage({type:'SKIP_WAITING'});}catch(e){}}
        return reg;
      }

      async function bootCurrentVersion(){
        // Preserve localStorage/settings/rating caches. Only HTTP CacheStorage from
        // older MGUU PWA builds is removed, so group/book/year/semester stay saved.
        try{await purgeLegacyCaches();}catch(e){}
        var workerPromise=installCurrentWorker().catch(function(){return null;});
        await loadCurrentApp();
        await workerPromise;
      }

      bootCurrentVersion().catch(showBootError);
      window.setTimeout(function(){if(!window.__mguuWebV039)showBootError();},7000);
    })();
  </script>
