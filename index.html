<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="МГУУ">
  <title>МГУУ</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <style>
    html,body{margin:0;min-height:100%;background:#f7f8fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}body{min-height:100dvh;overscroll-behavior:none}
    #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f7f8fc;color:#29364a;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
    #boot>div{display:flex;flex-direction:column;align-items:center;transform:translateY(-2vh)}
    #boot img{width:min(55vw,230px);height:min(55vw,230px);object-fit:contain;filter:drop-shadow(0 10px 22px rgba(48,58,82,.13));animation:logo .82s cubic-bezier(.2,.75,.25,1) both}
    #boot b{margin-top:18px;font-size:25px;letter-spacing:.08em}.dots{display:flex;gap:7px;margin-top:18px}.dots i{width:7px;height:7px;border-radius:50%;background:#7285ef;animation:dot 1.1s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}
    @keyframes logo{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}@keyframes dot{0%,70%,100%{opacity:.28;transform:translateY(0)}35%{opacity:1;transform:translateY(-4px)}}
    @media(prefers-color-scheme:dark){html,body,#boot{background:#111318;color:#edf1f7}}
  </style>
</head>
<body>
  <div id="boot"><div><img src="/icon-192.png" alt="Эмблема МГУУ"><b>МГУУ</b><span class="dots"><i></i><i></i><i></i></span></div></div>
  <script src="/app.js"></script>
  <script>
    if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}
  </script>
</body>
</html>
