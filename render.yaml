services:
  - type: web
    name: mguu-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MGUU_SESSION_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20.18.0
